<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Study Streak</title>
        <link rel="stylesheet" href="assets/css/style.css">
    </head>
    <body>
        <div class="app-shell">
            <div id="screen-home" class="screen">
            <div class="flame-hero">
                <svg id="flame-icon" width="72" height="72" viewBox="0 0 24 24" fill="#E5E5E5">
                <path d="M12 2c1 3-2 4-2 7a3 3 0 006 0c0-1-1-2-1-2 2 1 3 3 3 5a6 6 0 01-12 0c0-4 3-6 3-10 0 0 2 1 3 0z"/>
                </svg>
                <div id="streak-count" class="streak-number">0</div>
                <div class="streak-label">Hari Beruntun</div>
        </div>

        <div id="week-strip" class="week-strip"></div>
 
        <div class="stats-row">
            <div class="stat">
            <div id="stat-sessions" class="stat-value">0</div>
            <div class="stat-label">Total Sesi</div>
            </div>
            <div class="stat">
            <div id="stat-record" class="stat-value">0</div>
            <div class="stat-label">Rekor</div>
            </div>
            <div class="stat">
            <div id="stat-hours" class="stat-value stat-value-small">0.0 jam</div>
            <div class="stat-label">Jam Belajar</div>
            </div>
        </div>
 
        <div class="spacer"></div>
 
        <button id="btn-start" class="btn btn-primary">Mulai Belajar</button>
        <div class="hint-text">Streak bertambah setelah belajar minimal 1 jam</div>
        </div>
 
    <!-- ===== LAYAR ACTIVE (TIMER BERJALAN) ===== -->
        <div id="screen-active" class="screen" style="display:none;">
        <div class="ring-wrap">
            <svg width="220" height="220" viewBox="0 0 220 220">
            <circle cx="110" cy="110" r="90" fill="none" stroke="#F0F0F0" stroke-width="14" />
            <circle id="progress-ring" cx="110" cy="110" r="90" fill="none" stroke="#FF9600"
                    stroke-width="14" stroke-linecap="round" transform="rotate(-90 110 110)" />
            </svg>
            <div class="ring-center">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="#FF9600" id="ring-flame">
                <path d="M12 2c1 3-2 4-2 7a3 3 0 006 0c0-1-1-2-1-2 2 1 3 3 3 5a6 6 0 01-12 0c0-4 3-6 3-10 0 0 2 1 3 0z"/>
            </svg>
            <div id="timer-text" class="timer-text">00:00:00</div>
            </div>
        </div>
 
        <div id="active-status" class="active-status">Menuju target 1 jam…</div>
 
        <button id="btn-stop" class="btn btn-danger">Berhenti</button>
        </div>
 
        <!-- ===== LAYAR SUMMARY (HASIL SESI) ===== -->
        <div id="screen-summary" class="screen" style="display:none;">
        <div id="summary-icon-wrap" class="summary-icon-wrap">
            <svg id="summary-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#58CC02" stroke-width="3">
            <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div id="summary-title" class="summary-title">Kerja Bagus!</div>
        <div id="summary-message" class="summary-message"></div>
        <div id="summary-streak-row" class="summary-streak-row" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#FF9600">
            <path d="M12 2c1 3-2 4-2 7a3 3 0 006 0c0-1-1-2-1-2 2 1 3 3 3 5a6 6 0 01-12 0c0-4 3-6 3-10 0 0 2 1 3 0z"/>
            </svg>
            <span id="summary-streak-text">0 Hari Beruntun</span>
        </div>
        <button id="btn-back" class="btn btn-primary">Kembali</button>
        </div>
 
        <!-- ===== MODAL KONFIRMASI BERHENTI DINI ===== -->
        <div id="modal-confirm" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-title">Belum 1 jam</div>
            <div id="modal-elapsed-text" class="modal-text">Sesi ini baru 00:00:00. Jika dihentikan sekarang, streak tidak akan bertambah.</div>
            <button id="btn-cancel-stop" class="btn btn-primary">Lanjutkan Belajar</button>
            <button id="btn-confirm-stop" class="btn btn-ghost">Tetap Hentikan</button>
        </div>
        </div>
 
        </div>
 
        <script src="assets/js/script.js"></script>
    </body>
</html>
